<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Akari Charcoal Lacquer -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23211e"/>
      <stop offset="100%" stop-color="#11100f"/>
    </linearGradient>

    <!-- Noguchi Akari Paper Lantern Radial Glow -->
    <radialGradient id="lanternGlow" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fdf4e2"/>
      <stop offset="75%" stop-color="#e2ba7d"/>
      <stop offset="100%" stop-color="#b88842"/>
    </radialGradient>

    <!-- Tabletop Washi Ivory & Bamboo Wood Surface -->
    <linearGradient id="tabletopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6efe1"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dfcaa8"/>
    </linearGradient>

    <!-- Ambient Glow for Lantern -->
    <filter id="lanternBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#d4be9b" stroke-width="1.2" stroke-opacity="0.25"/>

  <!-- Ambient Golden Atmosphere -->
  <circle cx="32" cy="22" r="16" fill="#e0b77a" opacity="0.16"/>

  <!-- Akari Noguchi Paper Lantern Shade -->
  <g filter="url(#lanternBloom)">
    <ellipse cx="32" cy="22" rx="11.5" ry="9.5" fill="url(#lanternGlow)"/>
  </g>

  <!-- Lantern Bamboo Rib Lines (Noguchi Washi Form) -->
  <path d="M22.5 19 Q32 20.8 41.5 19" stroke="#8a632e" stroke-width="0.9" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M21 22 Q32 24.3 43 22" stroke="#8a632e" stroke-width="0.9" fill="none" opacity="0.65" stroke-linecap="round"/>
  <path d="M22.5 25 Q32 27.2 41.5 25" stroke="#8a632e" stroke-width="0.9" fill="none" opacity="0.6" stroke-linecap="round"/>

  <!-- Lantern Stem / Stand connecting onto the desk surface -->
  <line x1="32" y1="31.5" x2="32" y2="36" stroke="#ccb693" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="32" y1="11.5" x2="32" y2="12.5" stroke="#ccb693" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Desk Board (Tabletop Surface) -->
  <rect x="11" y="36" width="42" height="5.5" rx="2.75" fill="url(#tabletopGrad)"/>
  <!-- Crisp Top Reflection Highlight -->
  <line x1="13" y1="37" x2="51" y2="37" stroke="#ffffff" stroke-width="0.8" opacity="0.85" stroke-linecap="round"/>

  <!-- Architectural Trestle Legs (Japanese Woodcraft Angle) -->
  <line x1="18" y1="41.5" x2="14.5" y2="53" stroke="#ccb693" stroke-width="3" stroke-linecap="round"/>
  <line x1="46" y1="41.5" x2="49.5" y2="53" stroke="#ccb693" stroke-width="3" stroke-linecap="round"/>
  <!-- Structural Joinery Cross-Stretcher -->
  <line x1="16" y1="47.5" x2="48" y2="47.5" stroke="#ccb693" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>

  <!-- Artisan Vermilion Hanko Seal (Inkan Seal Stamp) -->
  <g transform="translate(46, 8)">
    <rect width="10" height="10" rx="2.5" fill="#c23828"/>
    <!-- Artisan mark within seal -->
    <path d="M5 2.5 L5 7.5 M2.8 4.2 L7.2 4.2 M3.5 5.5 L2.5 7.5 M6.5 5.5 L7.5 7.5" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
